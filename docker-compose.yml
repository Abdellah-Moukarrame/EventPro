
services:
  postgres:
    image: postgres:17
    container_name: eventpro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventpro
      POSTGRES_USER: eventpro
      POSTGRES_PASSWORD: eventpro123
    ports:
      - "5433:5432"
    volumes:
      - eventpro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpro -d eventpro"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: eventpro_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eventpro.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    volumes:
      - eventpro_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
  jenkins:
    image: jenkins/jenkins:lts
    container_name: eventpro_jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - eventpro_jenkins_data:/var/jenkins_home

  sonarqube:
    image: sonarqube:community
    container_name: eventpro_sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - eventpro_sonarqube_data:/opt/sonarqube/data
      - eventpro_sonarqube_logs:/opt/sonarqube/logs
      - eventpro_sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  eventpro_postgres_data:
  eventpro_pgadmin_data:
  eventpro_jenkins_data:
  eventpro_sonarqube_data:
  eventpro_sonarqube_logs:
  eventpro_sonarqube_extensions:
